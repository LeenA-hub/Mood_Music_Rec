<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mood Music Rec</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    .container {
      margin-top: 80px;
    }
    h1, h2 {
      color: #333;
    }
    .btn, button {
      background: pink;
      border: none;
      padding: 12px 20px;
      margin: 10px;
      cursor: pointer;
      border-radius: 6px;
      font-size: 16px;
    }
    .btn:hover, button:hover {
      background: hotpink;
      color: white;
    }
    section {
      display: none;
    }
    section.active {
      display: block;
    }
    #results button {
      display: block;
      margin: 10px auto;
      width: 250px;
    }
  </style>
</head>
<body>

  <!-- Front Page -->
  <section id="front" class="active">
    <div class="container">
      <h1>Welcome to Mood Music Rec</h1>
      <p>Find music that matches your mood 🎵</p>
      <button class="btn" onclick="showPage('search')">Start</button>
    </div>
  </section>

  <!-- Search Mood Page -->
  <section id="search">
    <div class="container">
      <h2>Select Your Mood</h2>
      <input type="text" id="moodInput" placeholder="Enter mood (happy, sad, chill...)" />
      <button onclick="searchMood()">Search</button>
      <div id="results"></div>
      <br>
      <button class="btn" onclick="showPage('front')">⬅ Back</button>
    </div>
  </section>

  <!-- Music Player Page -->
  <section id="music">
    <div class="container">
      <h2 id="songTitle">Now Playing: </h2>
      <audio id="audioPlayer" controls>
        <source id="audioSource" src="" type="audio/wav">
        Your browser does not support the audio element.
      </audio>
      <div class="controls">
        <button onclick="prevSong()">⏮ Prev</button>
        <button onclick="nextSong()">⏭ Next</button>
      </div>
      <br>
      <button class="btn" onclick="showPage('search')">⬅ Back</button>
    </div>
  </section>

  <script>
    let songs = [];
    let currentIndex = 0;
    let filteredSongs = [];

    // Load songs from CSV
    async function loadSongs() {
      try {
        const response = await fetch("songs.csv");
        const data = await response.text();

        const rows = data.trim().split("\n");
        songs = rows.map(row => {
          const [title, artist, mood, file] = row.split(",");
          return { title, artist, mood: mood.toLowerCase(), file };
        });
        console.log("Loaded songs:", songs);
      } catch (error) {
        console.error("Error loading songs.csv", error);
      }
    }

    // Page navigation
    function showPage(pageId) {
      document.querySelectorAll("section").forEach(sec => sec.classList.remove("active"));
      document.getElementById(pageId).classList.add("active");
    }

    // Search by mood
    function searchMood() {
      const mood = document.getElementById("moodInput").value.toLowerCase();
      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";

      filteredSongs = songs.filter(s => s.mood === mood);

      if (filteredSongs.length === 0) {
        resultsDiv.innerHTML = "<p>No songs found for this mood 😢</p>";
        return;
      }

      filteredSongs.forEach((song, index) => {
        const btn = document.createElement("button");
        btn.textContent = song.title + " - " + song.artist;
        btn.onclick = () => playSong(index);
        resultsDiv.appendChild(btn);
      });
    }

    // Play a song
    function playSong(index) {
      currentIndex = index;
      const song = filteredSongs[currentIndex];
      document.getElementById("songTitle").innerText = "Now Playing: " + song.title;
      document.getElementById("audioSource").src = song.file;
      document.getElementById("audioPlayer").load();
      document.getElementById("audioPlayer").play();
      showPage('music');
    }

    // Next & Prev controls
    function nextSong() {
      if (filteredSongs.length === 0) return;
      currentIndex = (currentIndex + 1) % filteredSongs.length;
      playSong(currentIndex);
    }

    function prevSong() {
      if (filteredSongs.length === 0) return;
      currentIndex = (currentIndex - 1 + filteredSongs.length) % filteredSongs.length;
      playSong(currentIndex);
    }

    // Load CSV on startup
    window.onload = loadSongs;
  </script>
</body>
</html>
